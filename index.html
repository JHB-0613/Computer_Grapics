<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴퓨터 그래픽스 기말 대비 문제은행</title>
    <style>
        :root { --blue: #4a90e2; --green: #2ecc71; --red: #e74c3c; --text: #2c3e50; }
        body { font-family: 'Pretendard', sans-serif; background: #f5f6fa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: var(--text); }
        .menu { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .btn { padding: 12px 20px; border: 2px solid var(--blue); background: white; color: var(--blue); border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover, .btn.active { background: var(--blue); color: white; }
        .quiz-card { background: white; width: 100%; max-width: 800px; border-radius: 15px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; }
        .quiz-card.active { display: block; }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #7f8c8d; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--blue); width: 0%; transition: 0.3s; }
        .question { font-size: 1.3rem; font-weight: bold; margin-bottom: 25px; line-height: 1.5; }
        .options { display: grid; gap: 12px; }
        .option { padding: 15px; border: 2px solid #edeff2; border-radius: 10px; cursor: pointer; transition: 0.2s; background: #fff; }
        .option:hover { border-color: var(--blue); background: #f0f7ff; }
        .option.correct { border-color: var(--green); background: #eafaf1; color: #27ae60; font-weight: bold; }
        .option.incorrect { border-color: var(--red); background: #fdedec; color: #c0392b; }
        .option.disabled { cursor: default; pointer-events: none; }
        .explanation { margin-top: 25px; padding: 20px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid var(--blue); display: none; line-height: 1.6; }
        .nav { display: flex; justify-content: space-between; margin-top: 30px; }
        .nav-btn { padding: 10px 25px; border: none; border-radius: 5px; background: var(--blue); color: white; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>📝 CG 기말고사 완전정복 (80문항)</h1>
    <div class="menu">
        <button class="btn" onclick="initQuiz('ch7')">7장: 3D Viewing</button>
        <button class="btn" onclick="initQuiz('ch8')">8장: 은면 제거</button>
        <button class="btn" onclick="initQuiz('ch9')">9장: 조명 모델</button>
        <button class="btn" onclick="initQuiz('ch10')">10장: 셰이딩</button>
        <button class="btn" onclick="initQuiz('all')">🏆 종합 모의고사 (20문항)</button>
    </div>

    <div class="quiz-card" id="card">
        <div class="progress-info">
            <span id="chap-name">Chapter</span>
            <span id="q-idx">1 / 20</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
        <div class="question" id="q-text">문제가 로드되지 않았습니다. 상단 버튼을 눌러주세요.</div>
        <div class="options" id="opt-list"></div>
        <div class="explanation" id="exp-box"></div>
        <div class="nav">
            <button class="nav-btn" id="p-btn" onclick="move(-1)">이전</button>
            <button class="nav-btn" id="n-btn" onclick="move(1)">다음</button>
        </div>
    </div>

<script>
const db = {
    ch7: [
        { q: "3D Viewing Pipeline에서 MC를 WC로 옮긴 후 다음 단계는?", o: ["PC (Projection)", "VC (Viewing)", "NC (Normalized)", "DC (Device)"], a: 1, e: "<b>해설:</b> 월드 좌표계(WC)에 물체를 배치한 뒤에는 카메라의 위치와 방향을 기준으로 하는 <b>카메라/뷰잉 좌표계(VC)</b>로 모든 물체를 옮겨야 합니다." },
        { q: "원근 투영에서 시야각(FOV)이 커지면 나타나는 현상은?", o: ["물체가 커진다", "보이는 범위가 넓어지고 물체는 작아진다 (광각)", "원근감이 사라진다", "화면이 밝아진다"], a: 1, e: "<b>해설:</b> FOV(Field of View)가 커지면 더 넓은 세상을 한 화면에 담기 때문에 각 물체는 상대적으로 작게 투영됩니다. (광각 렌즈 효과)" },
        { q: "UVN 좌표계에서 카메라의 오른쪽 방향을 나타내는 벡터는?", o: ["u", "v", "n", "Up"], a: 0, e: "<b>해설:</b> u는 가로(X), v는 세로(Y), n은 시선 깊이(Z)에 대응합니다." },
        { q: "직교 투영의 뷰 볼륨 형태는?", o: ["원뿔", "절두체(Frustum)", "직육면체(Rectangular Box)", "구형"], a: 2, e: "<b>해설:</b> 직교 투영은 모든 투영선이 평행하므로 박스 형태의 뷰 볼륨을 가집니다." },
        { q: "정규화 장치 좌표(NDC)의 범위는 보통 얼마인가?", o: ["0 to 1", "-1 to 1", "-255 to 255", "무한대"], a: 1, e: "<b>해설:</b> 효율적인 클리핑을 위해 모든 공간을 -1.0에서 1.0 사이의 정육면체로 통일합니다." },
        { q: "원근 투영에서 발생하는 '왜곡' 중 거리에 따른 크기 변화를 무엇이라 하는가?", o: ["Aliasing", "Foreshortening", "Shading", "Clipping"], a: 1, e: "<b>해설:</b> 멀리 있는 물체가 작게 보이는 현상을 원근 단축(Foreshortening)이라고 합니다." },
        { q: "Viewport 변환의 역할은?", o: ["3D 투영", "정규화 좌표를 실제 픽셀 좌표로 변환", "조명 계산", "그림자 생성"], a: 1, e: "<b>해설:</b> 가상의 -1~1 좌표를 실제 모니터 해상도(픽셀)로 변환하는 최종 단계입니다." },
        { q: "Look-at 함수가 생성하는 행렬은?", o: ["Modeling Matrix", "Viewing Matrix", "Projection Matrix", "Viewport Matrix"], a: 1, e: "<b>해설:</b> 카메라의 위치와 타겟을 설정하여 뷰 변환 행렬을 만듭니다." },
        { q: "원근 투영에서 모든 투영선이 모이는 점의 명칭은?", o: ["Vanishing Point", "Center of Projection (COP)", "Origin", "Normal Point"], a: 1, e: "<b>해설:</b> 모든 빛의 경로가 모이는 카메라 렌즈의 중심 혹은 눈의 위치를 COP라고 합니다." },
        { q: "Clipping이 가장 효율적으로 수행되는 좌표계는?", o: ["월드 좌표", "카메라 좌표", "정규화 좌표(NDC)", "스크린 좌표"], a: 2, e: "<b>해설:</b> -1과 1 사이인지 0과 1 사이인지 숫자만 비교하면 되는 NDC 단계가 가장 빠릅니다." },
        { q: "Perspective Division은 어떤 값으로 나누는 과정인가?", o: ["x", "y", "z", "w (또는 -z)"], a: 3, e: "<b>해설:</b> 동차 좌표계의 w값으로 나눔으로써 원근 효과가 수학적으로 완성됩니다." },
        { q: "평행 투영 중 축의 비율이 모두 같은 투영법은?", o: ["Isometric", "Oblique", "Perspective", "Cavalier"], a: 0, e: "<b>해설:</b> 등각(Isometric) 투영은 세 주축의 축소 비율이 모두 동일합니다." },
        { q: "카메라가 제자리에서 위아래로 움직이는 회전을 무엇이라 하는가?", o: ["Panning", "Tilting", "Rolling", "Dolly"], a: 1, e: "<b>해설:</b> 좌우 회전은 Panning, 위아래 회전은 Tilting입니다." },
        { q: "Aspect Ratio의 공식은?", o: ["Height / Width", "Width / Height", "Width + Height", "Z / W"], a: 1, e: "<b>해설:</b> 가로 길이를 세로 길이로 나눈 비율입니다." },
        { q: "원근 투영에서 '소실점'은 평행한 선들이 어디서 만나는 것처럼 보이는 점인가?", o: ["원점", "무한대", "카메라 위치", "Near Plane"], a: 1, e: "<b>해설:</b> 무한히 멀어질 때 좌표가 한 점으로 수렴하는 곳입니다." },
        { q: "오른손 좌표계에서 카메라가 바라보는 기본 방향은?", o: ["+X", "+Y", "+Z", "-Z"], a: 3, e: "<b>해설:</b> OpenGL 등 오른손 좌표계 표준에서는 카메라가 -Z 방향을 바라봅니다." },
        { q: "View-Up 벡터가 시선 벡터와 평행하면 발생하는 문제는?", o: ["화면이 밝아짐", "카메라 좌표계를 정의할 수 없음 (외적 불가)", "물체가 커짐", "투명해짐"], a: 1, e: "<b>해설:</b> 두 벡터가 평행하면 외적($\times$)을 통해 새로운 축(U)을 구할 수 없습니다." },
        { q: "Window-to-Viewport 변환 시 가로세로비가 다르면 생기는 현상은?", o: ["색상 왜곡", "물체 모양의 일그러짐 (Distortion)", "그림자 소실", "계단 현상"], a: 1, e: "<b>해설:</b> 비율이 안 맞으면 물체가 홀쭉하거나 뚱뚱하게 보입니다." },
        { q: "투영 행렬에서 Near 평면의 역할은?", o: ["가장 먼 경계", "가장 가까운 경계 (이보다 가까우면 잘림)", "빛의 세기", "해상도"], a: 1, e: "<b>해설:</b> 카메라와 너무 가까운 물체가 화면을 가리는 것을 막는 절단면입니다." },
        { q: "3D 뷰잉의 마지막 단계는?", o: ["조명", "뷰포트 변환", "모델 변환", "투영"], a: 1, e: "<b>해설:</b> 픽셀 좌표로 바꾸는 뷰포트 변환이 기하 변환의 마지막입니다." }
    ],
    ch8: [
        { q: "Z-Buffer의 초기값은?", o: ["0 (가까움)", "1 (멈)", "0.5", "-1"], a: 1, e: "<b>해설:</b> 가장 먼 상태(1.0)로 비워둬야 새로운 물체가 들어올 때 비교가 가능합니다." },
        { q: "Back-Face Culling의 판단 근거는?", o: ["색상", "면의 법선과 시선의 내적", "물체의 크기", "광원의 위치"], a: 1, e: "<b>해설:</b> 법선과 시선의 각도가 90도 이상이면 뒷면으로 간주합니다." },
        { q: "정렬(Sorting)이 필요한 은면 제거 알고리즘은?", o: ["Z-Buffer", "Painter's Algorithm", "Ray-Casting", "Back-face Culling"], a: 1, e: "<b>해설:</b> 멀리 있는 것부터 그려야 하므로 깊이 정렬이 필수입니다." },
        { q: "Z-Buffer의 가장 큰 장점은?", o: ["메모리 절약", "투명도 처리", "물체 정렬 불필요", "빠른 조명"], a: 2, e: "<b>해설:</b> 그리는 순서에 상관없이 픽셀 단위로 비교하므로 정렬이 필요 없습니다." },
        { q: "두 면의 깊이가 너무 비슷해 깜빡거리는 현상은?", o: ["Aliasing", "Z-fighting", "Mach Band", "Ghosting"], a: 1, e: "<b>해설:</b> 부동소수점 정밀도 한계로 앞뒤가 계속 바뀌는 현상입니다." },
        { q: "Image-Space 알고리즘의 예시가 아닌 것은?", o: ["Z-Buffer", "Ray-Casting", "Back-Face Culling", "Scan-Line"], a: 2, e: "<b>해설:</b> 후면 제거(Back-Face)는 픽셀이 아닌 폴리곤 데이터 단계에서 수행됩니다." },
        { q: "Painter's 알고리즘의 치명적 문제는?", o: ["속도가 너무 빠름", "순환 겹침(Cyclic Overlap) 해결 불가", "메모리 부족", "색상 부족"], a: 1, e: "<b>해설:</b> 세 물체가 서로 꼬여서 겹치면 정렬 순서를 정할 수 없습니다." },
        { q: "BSP-Tree가 주로 쓰이는 곳은?", o: ["움직이는 캐릭터", "고정된 배경 건물", "광원 계산", "텍스처 생성"], a: 1, e: "<b>해설:</b> 고정된 공간을 미리 분할해두어 가시성을 빠르게 판단합니다." },
        { q: "A-Buffer는 어떤 알고리즘의 확장인가?", o: ["Z-Buffer", "Ray-Tracing", "Flat Shading", "Clipping"], a: 0, e: "<b>해설:</b> Z-버퍼에 투명도와 안티앨리어싱을 더한 방식입니다." },
        { q: "Scan-Line 알고리즘에서 현재 훑고 있는 변의 리스트는?", o: ["Edge Table", "Active Edge Table (AET)", "Color Table", "Z-Table"], a: 1, e: "<b>해설:</b> 현재 Y 좌표에 걸쳐 있는 변들만 AET에서 관리합니다." },
        { q: "Object-Space 알고리즘의 특징은?", o: ["픽셀 단위 연산", "물체와 물체 간의 기하학적 비교", "해상도에 의존", "정렬이 필요 없음"], a: 1, e: "<b>해설:</b> 3D 공간상의 기하 데이터를 직접 비교합니다." },
        { q: "Ray-Casting에서 보이는 면을 결정하는 기준은?", o: ["가장 큰 면", "광선과 부딪힌 점 중 가장 가까운 점", "가장 밝은 면", "가장 나중에 그려진 면"], a: 1, e: "<b>해설:</b> 눈에서 쏜 광선에 처음 맞은 표면이 보이는 면입니다." },
        { q: "Z-Buffer에서 픽셀당 저장하는 값은?", o: ["RGB", "깊이(z) 값", "법선 벡터", "투명도"], a: 1, e: "<b>해설:</b> 해당 픽셀에서 지금까지 가장 가까웠던 물체의 깊이를 저장합니다." },
        { q: "닫힌 입체에서 뒷면이 제거되는 비율은 보통?", o: ["10%", "50%", "90%", "0%"], a: 1, e: "<b>해설:</b> 평균적으로 전체 면의 절반이 카메라 반대편을 향합니다." },
        { q: "가시성 판단을 위해 공간을 8개로 나누는 트리 구조는?", o: ["Binary Tree", "Quadtree", "Octree", "B-Tree"], a: 2, e: "<b>해설:</b> 3D 공간 분할에는 옥트리(Octree)가 쓰입니다." },
        { q: "Warnock 알고리즘의 기본 전략은?", o: ["정렬", "분할 정복 (영역 나누기)", "광선 추적", "색상 혼합"], a: 1, e: "<b>해설:</b> 화면을 4등분씩 쪼개며 판단이 쉬워질 때까지 반복합니다." },
        { q: "Z-Buffer의 정밀도를 높이려면?", o: ["비트(Bit) 수를 늘린다", "해상도를 낮춘다", "조명을 밝게 한다", "폴리곤을 줄인다"], a: 0, e: "<b>해설:</b> 16비트보다 24, 32비트 버퍼가 더 정밀하게 깊이를 비교합니다." },
        { q: "Painter's 알고리즘에서 물체를 쪼개는(Splitting) 이유는?", o: ["밝게 하기 위해", "순환 겹침을 해결하기 위해", "그림자를 위해", "속도를 위해"], a: 1, e: "<b>해설:</b> 꼬인 폴리곤을 잘라야만 앞뒤 순서를 정할 수 있습니다." },
        { q: "은면 제거의 다른 이름은?", o: ["Visibility Detection", "Shading", "Texturing", "Modeling"], a: 0, e: "<b>해설:</b> 보이는 면을 탐지하는 것과 같은 의미입니다." },
        { q: "Z-Buffer 하드웨어 가속이 가능한 이유는?", o: ["정렬이 필요 없어서 병렬 처리가 쉽기 때문", "정렬이 빠르기 때문", "색이 적어서", "공식이 간단해서"], a: 0, e: "<b>해설:</b> 픽셀들이 서로 독립적으로 깊이만 비교하면 되므로 GPU 처리에 적합합니다." }
    ],
    ch9: [
        { q: "주변광(Ambient)의 특징은?", o: ["그림자가 생김", "방향성이 없고 모든 면에 균일하게 적용", "거리에 따라 변함", "반짝거림"], a: 1, e: "<b>해설:</b> 간접광을 흉내 낸 기본 밝기입니다." },
        { q: "난반사(Diffuse)가 최대가 되는 조건은? (N:법선, L:광원)", o: ["N과 L이 수직", "N과 L이 나란함 (내적=1)", "N과 L의 각도가 180도", "관찰자가 정면에 있음"], a: 1, e: "<b>해설:</b> 빛이 면을 수직으로 비출 때 가장 밝습니다." },
        { q: "정반사(Specular) 하이라이트의 크기를 좁히는 파라미터는?", o: ["Ambient 계수", "Shininess (n)", "Diffuse 계수", "거리"], a: 1, e: "<b>해설:</b> 지수 n이 클수록 반짝임이 좁고 선명해집니다." },

let currentSet = [];
let currIdx = 0;
let score = 0;

function initQuiz(type) {
    document.getElementById('card').classList.add('active');
    if(type === 'all') {
        const all = [...db.ch7, ...db.ch8, ...db.ch9, ...db.ch10];
        currentSet = all.sort(() => Math.random() - 0.5).slice(0, 20);
        document.getElementById('chap-name').innerText = "🏆 전체 종합 모의고사";
    } else {
        currentSet = [...db[type]];
        const names = {ch7:"7장. 3D Viewing", ch8:"8장. 은면 제거", ch9:"9장. 조명 모델", ch10:"10장. 셰이딩"};
        document.getElementById('chap-name').innerText = names[type];
    }
    currIdx = 0; score = 0;
    render();
}

function render() {
    const data = currentSet[currIdx];
    document.getElementById('q-idx').innerText = `${currIdx + 1} / ${currentSet.length}`;
    document.getElementById('fill').style.width = `${((currIdx+1)/currentSet.length)*100}%`;
    document.getElementById('q-text').innerText = data.q;
    
    const list = document.getElementById('opt-list');
    list.innerHTML = '';
    data.o.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerText = t;
        div.onclick = () => select(i);
        list.appendChild(div);
    });

    document.getElementById('exp-box').style.display = 'none';
    document.getElementById('p-btn').disabled = currIdx === 0;
    document.getElementById('n-btn').innerText = currIdx === currentSet.length - 1 ? "종료" : "다음";
    
    if(data.user !== undefined) show(data.user);
}

function select(i) {
    if(currentSet[currIdx].user !== undefined) return;
    currentSet[currIdx].user = i;
    if(i === currentSet[currIdx].a) score++;
    show(i);
}

function show(i) {
    const data = currentSet[currIdx];
    const opts = document.querySelectorAll('.option');
    opts.forEach((o, idx) => {
        o.classList.add('disabled');
        if(idx === data.a) o.classList.add('correct');
        else if(idx === i) o.classList.add('incorrect');
    });
    const exp = document.getElementById('exp-box');
    exp.innerHTML = `<strong>📝 해설</strong><br>${data.e}`;
    exp.style.display = 'block';
}

function move(d) {
    if(d === 1 && currIdx === currentSet.length - 1) {
        alert(`완료! 점수: ${score} / ${currentSet.length}`);
        location.reload();
        return;
    }
    currIdx += d;
    render();
}
</script>
