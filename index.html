            { q: "국소 조명 모델(Local Illumination)과 전역 조명 모델(Global Illumination)의 차이는?", o: ["전역 모델은 다른 물체에서 반사된 간접광까지 계산한다.", "국소 모델이 더 느리다.", "전역 모델은 그림자를 못 만든다.", "차이가 없다."], a: 0, e: "Global Illumination은 빛의 반사, 굴절, 상호작용을 모두 추적하여 훨씬 사실적이지만 계산 비용이 큽니다." },
            { q: "Diffuse(난반사) 계산 공식의 핵심 항은? (N:법선, L:광원)", o: ["N · L", "N × L", "N + L", "N - L"], a: 0, e: "입사각의 코사인 값인 내적(N · L)이 빛을 받는 양을 결정합니다." },
            { q: "스포트라이트(Spot Light) 광원의 특징은?", o: ["모든 방향으로 균일하게 빛을 쏜다.", "평행한 빛을 쏜다.", "원뿔(Cone) 형태의 제한된 영역만 비춘다.", "면적이 넓은 광원이다."], a: 2, e: "무대 조명처럼 특정 방향과 각도로 빛을 제한하여 비추는 광원입니다." },
            { q: "다음 중 자체적으로 빛을 내는 성질을 나타내는 항은?", o: ["Emission", "Ambient", "Diffuse", "Specular"], a: 0, e: "Emission은 물체 자체가 발광하는 색상을 더해주는 항입니다." }
        ],
        ch10: [
            { q: "가장 계산이 빠르지만, 각진 모양(Faceted look)이 그대로 드러나는 셰이딩 기법은?", o: ["Flat Shading", "Gouraud Shading", "Phong Shading", "Ray Tracing"], a: 0, e: "폴리곤 하나당 한 번만 색을 계산하여 전체를 칠하는 플랫 셰이딩입니다." },
            { q: "Gouraud Shading(고로 셰이딩)의 보간(Interpolation) 대상은 무엇인가?", o: ["법선 벡터 (Normal)", "색상/밝기 (Intensity)", "좌표 (Position)", "텍스처 (Texture)"], a: 1, e: "꼭짓점(Vertex)에서 구한 '색상 값'을 내부 픽셀로 보간합니다." },
            { q: "Phong Shading(퐁 셰이딩)의 가장 큰 장점은?", o: ["계산이 빠르다.", "하이라이트(Specular)가 정확하고 사실적이다.", "마하 밴드 현상이 심하다.", "폴리곤이 각져 보인다."], a: 1, e: "픽셀마다 법선 벡터를 보간하여 조명을 다시 계산하므로, 하이라이트가 뭉개지지 않고 선명합니다." },
            { q: "Gouraud Shading의 치명적인 단점은?", o: ["계산이 너무 느리다.", "폴리곤 내부의 하이라이트를 표현하지 못하고 뭉개버린다.", "각져 보인다.", "색상이 너무 밝다."], a: 1, e: "꼭짓점만 계산하므로, 폴리곤 중앙에 맺혀야 할 빛 반사를 놓치는 경우가 많습니다." },
            { q: "Flat Shading에서 인접한 면의 밝기 차이가 과장되어 경계선이 띠처럼 보이는 착시 현상은?", o: ["Mach Band Effect (마하 밴드)", "Doppler Effect", "Aliasing", "Moiré Pattern"], a: 0, e: "우리 눈이 경계면의 명암 대비를 과장해서 인식하는 현상을 마하 밴드 효과라고 합니다." },
            { q: "안티앨리어싱(Anti-Aliasing)의 원리는?", o: ["경계선을 더 진하게 그린다.", "경계 픽셀의 색상을 배경과 혼합(Blending)하여 부드럽게 한다.", "해상도를 낮춘다.", "물체를 흐리게 만든다."], a: 1, e: "계단 현상을 없애기 위해 경계 부분에 중간색을 채워 시각적으로 부드럽게 만듭니다." },
            { q: "화면을 고해상도로 렌더링한 후 축소하여 안티앨리어싱 효과를 내는 기법은?", o: ["Super-sampling (Post-filtering)", "Area-sampling", "Z-buffering", "Texture Mapping"], a: 0, e: "크게 그려서 평균을 내는(축소하는) 방식이 슈퍼샘플링입니다." },
            { q: "Scan-Line 알고리즘에서 인접한 픽셀의 계산 결과를 재활용하여 속도를 높이는 원리는?", o: ["Spatial Coherence (공간적 응집성)", "Temporal Coherence", "Random Access", "Ray Tracing"], a: 0, e: "옆 픽셀은 나랑 비슷하다는 성질을 이용해 연산량을 줄입니다." },
            { q: "다음 중 계산량이 가장 많은(느린) 셰이딩 기법은?", o: ["Flat", "Gouraud", "Phong", "모두 같다"], a: 2, e: "Phong 셰이딩은 픽셀 수만큼 조명 공식을 돌려야 하므로 가장 무겁습니다." },
            { q: "폴리곤 셰이딩이 일어나는 렌더링 파이프라인 단계는?", o: ["Modeling", "Projection", "Scan Conversion (Rasterization)", "Viewing"], a: 2, e: "화면의 픽셀을 채우는 단계인 스캔 변환(래스터화) 단계에서 셰이딩이 수행됩니다." }
        ]
    };

    let currentQuiz = [];
    let currentIndex = 0;
    let score = 0;

    // 퀴즈 시작 함수
    function startQuiz(type) {
        document.getElementById('intro-msg').style.display = 'none';
        document.getElementById('quiz-box').classList.add('active');
        
        // 버튼 활성화 스타일
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // 문제 로드
        if (type === 'all') {
            // 전체 문제에서 랜덤 20개 추출
            const allQuestions = [...db.ch7, ...db.ch8, ...db.ch9, ...db.ch10];
            currentQuiz = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 20);
            document.getElementById('chapter-badge').innerText = "종합 모의고사";
        } else {
            currentQuiz = [...db[type]]; // 복사해서 사용
            const titles = {ch7:"Chapter 7", ch8:"Chapter 8", ch9:"Chapter 9", ch10:"Chapter 10"};
            document.getElementById('chapter-badge').innerText = titles[type];
        }

        currentIndex = 0;
        score = 0;
        renderQuestion();
    }

    function renderQuestion() {
        const qData = currentQuiz[currentIndex];
        
        // UI 업데이트
        document.getElementById('q-number').innerText = `${currentIndex + 1} / ${currentQuiz.length}`;
        document.getElementById('q-text').innerText = qData.q;
        
        // 프로그레스 바
        const progress = ((currentIndex) / currentQuiz.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;

        // 보기 초기화
        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';
        
        // 해설 숨기기
        const explanationBox = document.getElementById('explanation-box');
        explanationBox.style.display = 'none';
        explanationBox.innerHTML = '';

        // 보기 버튼 생성
        qData.o.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, idx);
            optionsBox.appendChild(btn);
        });

        // 이미 푼 문제라면 복원
        if (qData.userSelect !== undefined) {
            checkAnswer(optionsBox.children[qData.userSelect], qData.userSelect, true);
        }

        // 네비게이션 버튼 상태
        document.getElementById('prev-btn').disabled = (currentIndex === 0);
        document.getElementById('next-btn').innerText = (currentIndex === currentQuiz.length - 1) ? '결과 보기' : '다음';
    }

    function checkAnswer(btn, selectedIdx, isReplay = false) {
        const qData = currentQuiz[currentIndex];
        
        if (qData.userSelect !== undefined && !isReplay) return; // 이미 풀었으면 패스

        // 정답 기록
        if (!isReplay) {
            qData.userSelect = selectedIdx;
            if (selectedIdx === qData.a) score++;
        }

        // 스타일 적용
        const opts = document.getElementById('options-box').children;
        for (let i = 0; i < opts.length; i++) {
            opts[i].disabled = true;
            if (i === qData.a) {
                opts[i].classList.add('correct');
                opts[i].innerHTML += " ✅";
            } else if (i === selectedIdx && i !== qData.a) {
                opts[i].classList.add('incorrect');
                opts[i].innerHTML += " ❌";
            }
        }

        // 해설 표시
        const expBox = document.getElementById('explanation-box');
        expBox.innerHTML = `<strong>💡 해설:</strong><br>${qData.e}`;
        expBox.style.display = 'block';

        // 프로그레스 바 꽉 채우기 (마지막 문제일 때)
        if (currentIndex === currentQuiz.length - 1) {
             document.getElementById('progress-fill').style.width = `100%`;
        }
    }

    function changeQuestion(dir) {
        const nextIndex = currentIndex + dir;

        if (nextIndex >= currentQuiz.length) {
            // 결과 화면
            alert(`수고하셨습니다!\n총 ${currentQuiz.length}문제 중 ${score}개를 맞추셨습니다.\n점수: ${Math.round((score/currentQuiz.length)*100)}점`);
            return;
        }

        currentIndex = nextIndex;
        renderQuestion();
    }

</script>
