<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG 기말고사 완전정복 문제은행</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .menu-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .menu-btn {
            padding: 12px 24px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .menu-btn:hover, .menu-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .quiz-card {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: none;
        }
        .quiz-card.active { display: block; }
        .progress-container { margin-bottom: 20px; }
        .progress-text { font-size: 0.9rem; color: #666; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: 0.3s; }
        .question-text { font-size: 1.4rem; font-weight: 700; color: #2d3436; margin-bottom: 30px; line-height: 1.4; }
        .options-list { display: grid; gap: 15px; }
        .option-item {
            padding: 18px;
            border: 2px solid #e1e4e8;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
            font-size: 1.05rem;
            line-height: 1.4;
        }
        .option-item:hover:not(.disabled) { border-color: var(--primary-color); background: #f1f7ff; }
        .option-item.correct { border-color: var(--success-color); background: #e9f7ef; color: #155724; font-weight: 600; }
        .option-item.incorrect { border-color: var(--error-color); background: #fdeaea; color: #721c24; }
        .option-item.disabled { cursor: default; }
        .explanation-box {
            margin-top: 30px;
            padding: 25px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-left: 6px solid var(--primary-color);
            border-radius: 8px;
            display: none;
        }
        .exp-title { font-weight: 800; color: var(--primary-color); margin-bottom: 10px; display: block; }
        .nav-controls { display: flex; justify-content: space-between; margin-top: 40px; }
        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎓 CG 기말고사 집중 트레이닝</h1>
    <p>각 챕터별 20문제, 상세 해설 포함</p>
</div>

<div class="menu-container" id="main-menu">
    <button class="menu-btn" onclick="initQuiz('ch7')">7장: 3D Viewing</button>
    <button class="menu-btn" onclick="initQuiz('ch8')">8장: 은면 제거</button>
    <button class="menu-btn" onclick="initQuiz('ch9')">9장: 조명 모델</button>
    <button class="menu-btn" onclick="initQuiz('ch10')">10장: 셰이딩</button>
    <button class="menu-btn" onclick="initQuiz('all')">🔥 전체 종합 (20문항)</button>
</div>

<div class="quiz-card" id="quiz-card">
    <div class="progress-container">
        <div class="progress-text">
            <span id="chap-label">Chapter</span>
            <span id="idx-label">1 / 20</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="question-text" id="q-text"></div>
    <div class="options-list" id="options-list"></div>
    <div class="explanation-box" id="exp-box"></div>
    <div class="nav-controls">
        <button class="nav-btn" id="prev-btn" onclick="move(-1)">이전</button>
        <button class="nav-btn" id="next-btn" onclick="move(1)">다음</button>
    </div>
</div>

<script>
const db = {
    ch7: [
        {
            q: "3D 뷰잉 파이프라인에서 정규화 장치 좌표(NDC)로 변환하는 주된 이유는 무엇인가?",
            o: ["물체에 조명을 적용하기 위해서", "장치 독립적인 클리핑(Clipping) 처리를 위해서", "물체의 가려진 부분을 제거하기 위해서", "물체의 실제 크기를 보존하기 위해서"],
            a: 1,
            e: "<b>해설:</b> 모니터마다 해상도와 크기가 다르기 때문에, 이를 일일이 고려하여 화면 밖 물체를 자르는(Clipping) 것은 비효율적입니다. 따라서 모든 뷰 볼륨을 <b>-1에서 1 사이의 표준 정육면체</b>로 변환(정규화)하면, 어떤 시스템에서든 동일한 알고리즘으로 효율적인 클리핑이 가능해집니다."
        },
        {
            q: "카메라 좌표계(UVN)에서 v축(View-Up)을 구하는 수식으로 옳은 것은?",
            o: ["n × u", "u × n", "V_up × n", "n × V_up"],
            a: 0,
            e: "<b>해설:</b> 오른손 좌표계 기준 외적(Cross Product)의 순서가 중요합니다. n축(시선)과 u축(오른쪽)이 결정된 후, n과 u를 외적(n × u)해야 카메라의 위쪽 방향인 v축이 수직하게 산출됩니다. (u × n은 아래 방향 벡터가 됨)"
        },
        {
            q: "원근 투영(Perspective Projection)에서 시야각(FOV)이 좁아질 때 나타나는 현상은?",
            o: ["물체가 멀리 있는 것처럼 보인다.", "물체가 확대되어 보이는 망원(Zoom-in) 효과가 나타난다.", "화면의 왜곡이 심해진다.", "물체가 투명해진다."],
            a: 1,
            e: "<b>해설:</b> 시야각(Field of View)은 카메라 렌즈의 화각과 같습니다. 각도가 좁아지면 보이는 범위는 좁아지는 대신 특정 물체가 화면에 크게 맺히게 되므로, 줌 렌즈로 당겨 찍는 것과 같은 <b>망원 효과</b>가 발생합니다."
        },
        {
            q: "직교 투영(Orthographic Projection) 행렬에서 z축 성분이 음수(-)로 변환되는 주된 이유는?",
            o: ["원근감을 만들기 위해서", "오른손 좌표계를 왼손 좌표계로 변환하기 위해서", "물체를 회전시키기 위해서", "색상 값을 정규화하기 위해서"],
            a: 1,
            e: "<b>해설:</b> OpenGL 같은 시스템은 기본적으로 오른손 좌표계(카메라가 -z를 봄)를 사용하지만, 정규화 과정에서는 계산의 편의를 위해 앞쪽이 양수가 되는 왼손 좌표계 형태로 변환하는 경우가 많습니다. 이때 방향을 뒤집기 위해 z축에 마이너스 부호가 적용됩니다."
        },
        {
            q: "3D 뷰잉 단계 중 'Clipping'이 수행되는 시점은 언제인가?",
            o: ["월드 좌표계 변환 직후", "투영 변환 이후 정규화 좌표계에서", "조명 계산 단계에서", "화면 출력 직후"],
            a: 1,
            e: "<b>해설:</b> 클리핑은 화면에 보이지 않는 부분을 잘라내는 작업입니다. 가장 효율적인 시점은 모든 뷰 볼륨이 -1~1 사이의 정육면체 박스로 고정된 <b>정규화 좌표계(NDC)</b> 단계입니다. 이때는 좌표가 1보다 큰지 -1보다 작은지만 체크하면 되기 때문입니다."
        },
        {
            q: "원근 투영의 뷰 볼륨인 절두체(Frustum)를 정의할 때 필요하지 않은 값은?",
            o: ["Field of View (FOV)", "Aspect Ratio (종횡비)", "Near/Far Plane Distance", "Light Source Position"],
            a: 3,
            e: "<b>해설:</b> 절두체는 카메라의 시야 범위를 정의하는 것이므로, 화각(FOV), 화면 가로세로 비율(Aspect), 어디서부터 어디까지 볼지(Near/Far)의 정보가 필요합니다. 광원의 위치는 조명(Lighting) 단계에서 필요하며 뷰 볼륨 정의와는 무관합니다."
        },
        {
            q: "동차 좌표계(Homogeneous Coordinates)에서 [x, y, z, w]의 w값이 0일 때의 의미는?",
            o: ["원점에 위치한 점", "무한히 멀리 있는 방향(벡터)", "존재하지 않는 좌표", "화면 중앙의 픽셀"],
            a: 1,
            e: "<b>해설:</b> w가 1이면 특정한 위치(점)를 나타내지만, w가 0이면 위치가 없는 <b>방향(벡터)</b>을 의미하게 됩니다. 이는 무한히 멀리 있는 점으로 해석되어 태양광 같은 평행 광원을 표현할 때 유용하게 쓰입니다."
        },
        {
            q: "Viewport Transformation의 역할로 옳은 것은?",
            o: ["물체의 가려짐을 판단한다.", "정규화된 좌표를 실제 윈도우 픽셀 좌표로 매핑한다.", "3D 공간을 2D로 투영한다.", "물체 표면의 색을 결정한다."],
            a: 1,
            e: "<b>해설:</b> NDC 좌표계(-1~1)는 추상적인 숫자입니다. 이를 실제 사용자의 모니터 해상도(예: 800x600)의 실제 픽셀 위치로 비례에 맞춰 환산해주는 단계를 뷰포트 변환이라고 합니다."
        },
        {
            q: "3D 공간에서 카메라를 특정 축을 중심으로 회전시키는 변환 행렬의 특징은?",
            o: ["행렬식(Determinant)이 0이다.", "역행렬이 전치행렬(Transpose)과 같은 직교 행렬이다.", "대각 성분이 모두 0이다.", "행렬의 모든 합이 1이다."],
            a: 1,
            e: "<b>해설:</b> 순수 회전 행렬(Rotation Matrix)은 <b>직교 행렬(Orthogonal Matrix)</b>이라는 특성을 가집니다. 이 때문에 역행렬을 복잡하게 구할 필요 없이 행과 열만 바꾼 전치행렬을 취하면 바로 역행렬이 되어 계산 효율이 매우 좋습니다."
        },
        {
            q: "원근 투영에서 '소실점(Vanishing Point)'이 생기는 수학적 이유는?",
            o: ["빛의 회절 현상 때문에", "좌표를 깊이(z) 값으로 나누기 때문에", "카메라 렌즈의 굴절 때문에", "물체의 반사율 때문에"],
            a: 1,
            e: "<b>해설:</b> 원근 투영 변환 후 수행되는 <b>Perspective Division</b> 단계에서 x, y 좌표를 z(깊이)로 나눕니다. z가 커질수록(멀어질수록) x, y 값은 0에 가까워지게 되며, 이것이 시각적으로 평행한 선들이 한 점(0,0)으로 모이는 소실점 현상을 만듭니다."
        },
        {
            q: "다음 중 뷰 평면(View Plane)에 대한 설명으로 옳은 것은?",
            o: ["항상 월드 좌표계의 z=0 평면이다.", "카메라 시선 방향에 수직인 2D 투영면이다.", "물체의 뒷면을 의미한다.", "광원의 위치를 나타내는 평면이다."],
            a: 1,
            e: "<b>해설:</b> 뷰 평면은 카메라 렌즈 앞에 놓인 필름이나 이미지 센서라고 생각하면 됩니다. 카메라 좌표계의 n축(시선)에 수직으로 위치하여 3D 물체가 2D 이미지로 맺히는 가상의 평면입니다."
        },
        {
            q: "Look-at 함수를 통해 뷰 변환 행렬을 생성할 때, 내부적으로 수행되는 두 연산은?",
            o: ["이동(Translation)과 회전(Rotation)", "이동(Translation)과 크기 조절(Scaling)", "회전(Rotation)과 전단(Shearing)", "투영(Projection)과 클리핑(Clipping)"],
            a: 0,
            e: "<b>해설:</b> 카메라를 원하는 위치에 놓고 원하는 곳을 보게 만들려면, 먼저 카메라 위치($P_0$)를 원점으로 옮기는 <b>이동</b>을 수행한 뒤, 카메라의 축(uvn)을 월드 축(xyz)과 일치시키는 <b>회전</b> 연산을 수행해야 합니다."
        },
        {
            q: "Aspect Ratio(종횡비)가 2.0일 때 뷰 윈도우의 가로 세로 비율은?",
            o: ["가로가 세로의 0.5배", "가로가 세로의 2배", "가로와 세로가 같다", "세로가 가로의 2배"],
            a: 1,
            e: "<b>해설:</b> 종횡비(Aspect Ratio)는 <b>가로(Width) / 세로(Height)</b>의 비율입니다. 따라서 2.0이라면 가로 길이가 세로 길이보다 2배 더 길다는 것을 의미합니다."
        },
        {
            q: "평행 투영 중 'Cavalier Projection'의 특징은?",
            o: ["투영각이 90도이다.", "수평선과 45도 각도를 이루며 실제 길이를 유지한다.", "길이가 0.5배로 축소된다.", "원근감이 매우 강하다."],
            a: 1,
            e: "<b>해설:</b> Oblique(경사) 투영의 한 종류인 Cavalier 투영은 투영선이 지면과 45도를 이루며, 깊이 방향의 길이를 축소하지 않고 실제 길이 그대로 표현하는 것이 특징입니다."
        },
        {
            q: "원근 투영 행렬의 [3][2] 성분이 -1인 이유는 무엇인가?",
            o: ["z값을 w성분으로 복사하기 위해", "물체를 뒤집기 위해", "화면을 어둡게 하기 위해", "조명을 반사시키기 위해"],
            a: 0,
            e: "<b>해설:</b> 행렬 곱셈 결과에서 $w$ 성분에 $z$ 값을 저장하기 위해서입니다. 그래야 나중에 좌표를 $w$로 나눌 때 사실상 $z$로 나누는 효과(원근 효과)를 낼 수 있기 때문입니다."
        },
        {
            q: "Dolly-in 효과와 Zoom-in 효과의 차이점은?",
            o: ["차이가 없다.", "Dolly는 카메라 자체가 이동하고, Zoom은 렌즈 화각(FOV)을 조절한다.", "Dolly는 회전이고, Zoom은 이동이다.", "Dolly는 어둡게 하고, Zoom은 밝게 한다."],
            a: 1,
            e: "<b>해설:</b> 돌리(Dolly)는 카메라를 실은 수레를 직접 물체 쪽으로 밀고 들어가는 <b>이동</b>이고, 줌(Zoom)은 제자리에서 렌즈의 초점 거리를 바꿔 <b>시야각(FOV)</b>을 좁히는 것입니다. 시각적으로 물체가 커지는 것은 비슷하지만 배경의 왜곡 느낌이 다릅니다."
        },
        {
            q: "카메라 좌표계 u, v, n 벡터 중 월드 좌표계의 '오른쪽' 방향에 대응하는 것은?",
            o: ["u", "v", "n", "V_up"],
            a: 0,
            e: "<b>해설:</b> 카메라 좌표계에서 u는 가로(X축/오른쪽), v는 세로(Y축/위쪽), n은 깊이(Z축/시선방향)를 담당합니다."
        },
        {
            q: "Axonometric 투영 중 세 축의 각도가 모두 동일한 투영법은?",
            o: ["Isometric (등각 투영)", "Dimetric", "Trimetric", "Oblique"],
            a: 0,
            e: "<b>해설:</b> 'Iso'는 같다는 의미입니다. Isometric 투영은 물체의 세 주축이 투영면과 이루는 각도가 모두 같아(120도 간격), 모든 방향의 축소 비율이 동일한 투영법입니다."
        },
        {
            q: "3D 뷰잉 단계 중 'Scan Conversion' 직전에 수행되는 단계는?",
            o: ["Modeling Transform", "Lighting", "Viewport Transform", "Viewing Transform"],
            a: 2,
            e: "<b>해설:</b> 렌더링 파이프라인의 마지막 변환은 실제 픽셀 좌표로 바꾸는 <b>Viewport Transform</b>이며, 그 결과값(픽셀 좌표)을 가지고 실제로 화면의 점을 찍는 <b>Scan Conversion</b>이 시작됩니다."
        },

            a: 3,
            e: "<b>해설:</b> 엣지 테이블은 폴리곤의 <b>모양(경계선)</b>을 픽셀로 바꾸기 위한 기하 정보(위치, 기울기 등)를 담습니다. 반사율 같은 재질 정보는 셰이딩 단계에서 따로 처리합니다."

let currentSet = [];
let currentIndex = 0;
let userScore = 0;

function initQuiz(type) {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('quiz-card').classList.add('active');
    
    if(type === 'all') {
        const all = [...db.ch7, ...db.ch8, ...db.ch9, ...db.ch10];
        currentSet = all.sort(() => Math.random() - 0.5).slice(0, 20);
        document.getElementById('chap-label').innerText = "🏆 전체 종합 모의고사";
    } else {
        currentSet = [...db[type]];
        const titles = {ch7:"7장. 3D Viewing", ch8:"8장. 은면 제거", ch9:"9장. 조명 모델", ch10:"10장. 셰이딩"};
        document.getElementById('chap-label').innerText = titles[type];
    }
    
    currentIndex = 0;
    userScore = 0;
    render();
}

function render() {
    const data = currentSet[currentIndex];
    document.getElementById('idx-label').innerText = `${currentIndex + 1} / ${currentSet.length}`;
    document.getElementById('progress-fill').style.width = `${((currentIndex+1)/currentSet.length)*100}%`;
    document.getElementById('q-text').innerText = data.q;
    
    const list = document.getElementById('options-list');
    list.innerHTML = '';
    
    data.o.forEach((txt, i) => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerText = txt;
        div.onclick = () => select(i);
        list.appendChild(div);
    });
    
    document.getElementById('exp-box').style.display = 'none';
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').innerText = currentIndex === currentSet.length - 1 ? "종료" : "다음";

    // 이미 푼 경우 복구
    if(data.userAns !== undefined) {
        showResult(data.userAns);
    }
}

function select(idx) {
    const data = currentSet[currentIndex];
    if(data.userAns !== undefined) return;
    
    data.userAns = idx;
    if(idx === data.a) userScore++;
    showResult(idx);
}

function showResult(idx) {
    const data = currentSet[currentIndex];
    const items = document.querySelectorAll('.option-item');
    
    items.forEach((item, i) => {
        item.classList.add('disabled');
        if(i === data.a) item.classList.add('correct');
        else if(i === idx) item.classList.add('incorrect');
    });
    
    const expBox = document.getElementById('exp-box');
    expBox.innerHTML = `<span class="exp-title">📝 정답 상세 해설</span>${data.e}`;
    expBox.style.display = 'block';
}

function move(step) {
    if(step === 1 && currentIndex === currentSet.length - 1) {
        alert(`수고하셨습니다!\n점수: ${userScore} / ${currentSet.length} (${Math.round(userScore/currentSet.length*100)}점)`);
        location.reload();
        return;
    }
    currentIndex += step;
    render();
}
</script>
